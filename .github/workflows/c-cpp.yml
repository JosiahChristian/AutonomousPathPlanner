name: Autonomy Guidance Core Validation Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]

    env:
      CXX: ${{ matrix.compiler }}

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v7

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

    - name: Build planner and tests
      run: cmake --build build --config Release --parallel

    - name: Run planner tests
      run: ctest --test-dir build --build-config Release --output-on-failure

    - name: Verify generated visualizer scenario
      run: |
        ./build/run_planner --json > /tmp/generated-scenario.json
        diff --unified visualizer/scenario.json /tmp/generated-scenario.json

  sanitizers:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v7

    - name: Configure sanitizer build
      env:
        CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
        LDFLAGS: -fsanitize=address,undefined
      run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

    - name: Build with sanitizers
      run: cmake --build build-sanitized --parallel

    - name: Run sanitizer tests
      run: ctest --test-dir build-sanitized --output-on-failure
